# Configuração das funções para o Supabase CLI (supabase functions deploy).
# O webhook do Mercado Pago chega sem login, por isso não exige token do Supabase;
# a autenticidade é conferida pela assinatura x-signature (MP_WEBHOOK_SECRET).
[functions.webhook-mercadopago]
verify_jwt = false

[functions.criar-assinatura]
verify_jwt = true

[functions.cancelar-assinatura]
verify_jwt = true

[functions.link-video]
verify_jwt = true
