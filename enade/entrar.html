<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · ENADE Explicado</title>
<meta name="theme-color" content="#141111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="topbar solid"><a class="logo" href="index.html">ENADE <span>Explicado</span></a></header>

<main class="wrapp estreito">
  <h1 id="titulo">Entrar</h1>
  <p class="lead" id="sub">Acesse sua conta para assistir às explicações.</p>
  <div class="caixa">
    <div class="abas" role="tablist" id="abas">
      <button type="button" role="tab" data-aba="entrar" aria-selected="true">Entrar</button>
      <button type="button" role="tab" data-aba="cadastro" aria-selected="false">Criar conta</button>
    </div>
    <div id="msg" class="msg" hidden></div>

    <form id="f-entrar" novalidate>
      <label class="campo">E-mail<input name="email" type="email" autocomplete="email" required></label>
      <label class="campo">Senha<input name="senha" type="password" autocomplete="current-password" required></label>
      <button class="btn prim full" type="submit">Entrar</button>
      <div class="links"><button type="button" data-ir="esqueci">Esqueci minha senha</button></div>
    </form>

    <form id="f-cadastro" novalidate hidden>
      <label class="campo">Nome<input name="nome" autocomplete="name" required></label>
      <label class="campo">E-mail<input name="email" type="email" autocomplete="email" required></label>
      <label class="campo">Senha <span class="hint">(mínimo de 8 caracteres)</span><input name="senha" type="password" autocomplete="new-password" minlength="8" required></label>
      <label class="campo check"><input type="checkbox" name="aceite" required><span>Li e aceito os <a href="termos.html" target="_blank">Termos de uso</a> e a <a href="privacidade.html" target="_blank">Política de privacidade</a>.</span></label>
      <button class="btn prim full" type="submit">Criar conta</button>
    </form>

    <form id="f-esqueci" novalidate hidden>
      <p class="hint" style="margin-top:0">Digite seu e-mail. Enviaremos um link para você criar uma nova senha.</p>
      <label class="campo">E-mail<input name="email" type="email" autocomplete="email" required></label>
      <button class="btn prim full" type="submit">Enviar link</button>
      <div class="links"><button type="button" data-ir="entrar">Voltar para entrar</button></div>
    </form>

    <form id="f-nova" novalidate hidden>
      <label class="campo">Nova senha <span class="hint">(mínimo de 8 caracteres)</span><input name="senha" type="password" autocomplete="new-password" minlength="8" required></label>
      <label class="campo">Repita a nova senha<input name="senha2" type="password" autocomplete="new-password" required></label>
      <button class="btn prim full" type="submit">Salvar nova senha</button>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="comum.js"></script>
<script src="api.js"></script>
<script>
(function () {
  avisoConfiguracao();
  var p = new URLSearchParams(location.search);
  // Só aceita voltar para páginas deste próprio site
  var volta = /^[a-z0-9_-]+\.html(\?[^#]*)?$/i.test(p.get("volta") || "") ? p.get("volta") : "index.html";
  var TEXTOS = {
    entrar: ["Entrar", "Acesse sua conta para assistir às explicações."],
    cadastro: ["Criar conta", "Crie sua conta grátis. Depois é só escolher um plano."],
    esqueci: ["Recuperar senha", "Sem problema, acontece."],
    nova: ["Nova senha", "Escolha uma nova senha para sua conta."]
  };
  var msg = document.getElementById("msg");
  function mostrar(texto, tipo) { msg.textContent = texto; msg.className = "msg " + (tipo || "erro"); msg.hidden = !texto; }

  function ir(aba) {
    ["entrar", "cadastro", "esqueci", "nova"].forEach(function (a) { document.getElementById("f-" + a).hidden = a !== aba; });
    document.getElementById("abas").hidden = aba === "esqueci" || aba === "nova";
    document.querySelectorAll("[data-aba]").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.aba === aba); });
    document.getElementById("titulo").textContent = TEXTOS[aba][0];
    document.getElementById("sub").textContent = TEXTOS[aba][1];
    document.title = TEXTOS[aba][0] + " · ENADE Explicado";
    mostrar("");
    var primeiro = document.querySelector("#f-" + aba + " input");
    if (primeiro) primeiro.focus();
  }
  document.querySelectorAll("[data-aba]").forEach(function (b) { b.addEventListener("click", function () { ir(b.dataset.aba); }); });
  document.querySelectorAll("[data-ir]").forEach(function (b) { b.addEventListener("click", function () { ir(b.dataset.ir); }); });

  // Botão ocupado enquanto espera o servidor
  async function enviar(form, fn) {
    var btn = form.querySelector("[type=submit]"), txt = btn.textContent;
    btn.disabled = true; btn.textContent = "Aguarde…";
    try { await fn(); } catch (e) { mostrar(erroAmigavel(e)); }
    finally { btn.disabled = false; btn.textContent = txt; }
  }
  function valor(form, nome) { return form.elements[nome].value.trim(); }
  var emailOk = function (e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); };

  document.getElementById("f-entrar").addEventListener("submit", function (ev) {
    ev.preventDefault(); var f = this;
    if (!emailOk(valor(f, "email"))) return mostrar("Digite um e-mail válido.");
    if (!f.elements.senha.value) return mostrar("Digite sua senha.");
    enviar(f, async function () { await Api.entrar(valor(f, "email"), f.elements.senha.value); location.href = volta; });
  });

  document.getElementById("f-cadastro").addEventListener("submit", function (ev) {
    ev.preventDefault(); var f = this;
    if (!valor(f, "nome")) return mostrar("Digite seu nome.");
    if (!emailOk(valor(f, "email"))) return mostrar("Digite um e-mail válido.");
    if (f.elements.senha.value.length < 8) return mostrar("A senha precisa ter pelo menos 8 caracteres.");
    if (!f.elements.aceite.checked) return mostrar("Para criar a conta, aceite os Termos de uso e a Política de privacidade.");
    enviar(f, async function () {
      var email = valor(f, "email");
      var r = await Api.cadastrar(valor(f, "nome"), email, f.elements.senha.value);
      if (r.precisaConfirmar) {
        f.reset(); ir("entrar");
        document.querySelector("#f-entrar [name=email]").value = email;
        mostrar("Conta criada! Enviamos um link de confirmação para " + email + ". Clique nele e depois entre aqui.", "ok");
      } else location.href = volta === "index.html" ? "planos.html" : volta;
    });
  });

  document.getElementById("f-esqueci").addEventListener("submit", function (ev) {
    ev.preventDefault(); var f = this;
    if (!emailOk(valor(f, "email"))) return mostrar("Digite um e-mail válido.");
    enviar(f, async function () {
      await Api.recuperar(valor(f, "email"));
      mostrar("Se existir uma conta com esse e-mail, você vai receber o link em alguns minutos. Confira também o spam.", "ok");
    });
  });

  document.getElementById("f-nova").addEventListener("submit", function (ev) {
    ev.preventDefault(); var f = this;
    if (f.elements.senha.value.length < 8) return mostrar("A senha precisa ter pelo menos 8 caracteres.");
    if (f.elements.senha.value !== f.elements.senha2.value) return mostrar("As duas senhas estão diferentes.");
    enviar(f, async function () {
      await Api.novaSenha(f.elements.senha.value);
      mostrar("Senha alterada! Redirecionando…", "ok");
      setTimeout(function () { location.href = "index.html"; }, 1500);
    });
  });

  // Link do e-mail de recuperação abre esta página já com sessão temporária
  Api.aoMudarSessao(function (ev) { if (ev === "PASSWORD_RECOVERY") ir("nova"); });

  if (p.get("modo") === "nova-senha") ir("nova");
  else ir(p.get("aba") === "cadastro" ? "cadastro" : "entrar");
  if (p.get("confirmado")) mostrar("E-mail confirmado! Agora é só entrar.", "ok");
})();
</script>
</body>
</html>
