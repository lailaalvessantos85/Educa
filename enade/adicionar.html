<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="top wrap">
  <h1>Gerador de cards</h1>
  <p>Preencha os campos, confira a prévia do card e copie o bloco de código. Cole o bloco no arquivo <code>videos.js</code>, antes do <code>];</code> final. <a href="index.html">Voltar para a plataforma</a></p>
</header>
<main class="wrap">
  <form class="form" id="f" autocomplete="off">
    <label class="full">Link do vídeo no YouTube
      <input name="youtube" placeholder="https://www.youtube.com/watch?v=... ou https://youtu.be/...">
      <span class="hint" id="yhint">Vale link de vídeo normal, Shorts ou "não listado".</span>
    </label>
    <label class="full">Título do card<input name="titulo" placeholder="Ex.: Matriz SWOT aplicada ao estudo de caso"></label>
    <label>Curso<input name="curso" list="l-curso" placeholder="Ex.: Administração"></label>
    <label>Ano da prova<input name="ano" type="number" min="2004" max="2100" placeholder="Ex.: 2022"></label>
    <label>Número da questão<input name="questao" type="number" min="1" max="99" placeholder="Ex.: 14"></label>
    <label>Tipo de questão
      <select name="tipo"><option>Componente Específico</option><option>Formação Geral</option></select>
    </label>
    <label>Tema<input name="tema" list="l-tema" placeholder="Ex.: Marketing"></label>
    <label>Professor<input name="professor" list="l-professor" placeholder="Ex.: Profa. Laila"></label>
    <label>Duração<input name="duracao" placeholder="Ex.: 6:40"></label>
    <label class="full">Descrição (opcional)<textarea name="descricao" placeholder="Uma ou duas frases sobre o que o vídeo explica."></textarea></label>
    <datalist id="l-curso"></datalist><datalist id="l-tema"></datalist><datalist id="l-professor"></datalist>
  </form>
  <div class="out">
    <div><h2 style="font-size:20px;margin-bottom:10px">Prévia</h2><div id="prev"></div></div>
    <div>
      <h2 style="font-size:20px;margin-bottom:10px">Bloco para colar em videos.js</h2>
      <pre id="code"></pre>
      <button class="btn" type="button" id="copy">Copiar bloco</button>
      <span id="ok" class="hint" style="margin-left:10px" aria-live="polite"></span>
    </div>
  </div>
</main>
<script src="videos.js"></script>
<script src="comum.js"></script>
<script>
(function () {
  var f = document.getElementById("f");
  // Sugere cursos, temas e professores que já existem, para manter os nomes iguais (os filtros dependem disso).
  ["curso", "tema", "professor"].forEach(function (k) {
    var vals = {};
    (window.VIDEOS || []).forEach(function (v) { if (v[k]) vals[v[k]] = 1; });
    document.getElementById("l-" + k).innerHTML = Object.keys(vals).sort().map(function (x) { return '<option value="' + esc(x) + '">'; }).join("");
  });

  function dados() {
    var d = {};
    ["titulo", "youtube", "curso", "ano", "questao", "tipo", "tema", "professor", "duracao", "descricao"].forEach(function (k) {
      d[k] = f.elements[k].value.trim();
    });
    var id = ytId(d.youtube);
    if (id) d.youtube = "https://youtu.be/" + id;
    return d;
  }
  function bloco(d) {
    var linhas = Object.keys(d).map(function (k) {
      var v = d[k];
      var num = (k === "ano" || k === "questao") && /^\d+$/.test(v);
      return "    " + k + ": " + (num ? v : JSON.stringify(v));
    });
    return "  {\n" + linhas.join(",\n") + "\n  },";
  }
  function atualizar() {
    var d = dados();
    var raw = f.elements.youtube.value.trim();
    document.getElementById("yhint").textContent = !raw ? 'Vale link de vídeo normal, Shorts ou "não listado".'
      : ytId(raw) ? "Vídeo reconhecido: " + ytId(raw) : "Não reconheci esse link. Copie o endereço direto do vídeo no YouTube.";
    var prev = Object.assign({}, d, { titulo: d.titulo || "Título do vídeo", curso: d.curso || "Curso", ano: d.ano || "2024" });
    document.getElementById("prev").innerHTML = '<div style="max-width:320px">' + cardHTML(prev, 0) + "</div>";
    document.getElementById("code").textContent = bloco(d);
  }
  f.addEventListener("input", atualizar);
  document.getElementById("copy").addEventListener("click", function () {
    var txt = document.getElementById("code").textContent;
    var ok = document.getElementById("ok");
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(
      function () { ok.textContent = "Copiado!"; },
      function () { ok.textContent = "Selecione o texto e copie com Ctrl+C."; }
    );
  });
  atualizar();
})();
</script>
</body>
</html>
